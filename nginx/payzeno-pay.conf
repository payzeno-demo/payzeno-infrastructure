# nginx/payzeno-pay.conf — pay.payzeno.com, the hosted payment page and embedded checkout.
#
# The page is static (payzeno-checkout), but unlike the console it is FRAMED by merchant
# sites in embedded mode, so its headers differ in exactly one place: frame-ancestors.
#   /embed/*  may be framed by anyone at the HTTP layer. The page itself refuses to render
#             unless the parent is the session's allowed_origin (payzeno-checkout
#             src/lib/embed.ts) — the allowed origin is per session, which a static header
#             cannot express.
#   anything else (the hosted page at /c/*) may not be framed at all.
#
# /v1/checkout/ is proxied to the API so the page calls its own origin: no CORS on a surface
# that handles card flows. Only that prefix — the rest of /v1 is not reachable from here.

upstream payzeno_checkout { server payzeno-checkout:8083 max_fails=3 fail_timeout=10s; }

# Shopper country for adaptive pricing and risk (RFC platform-v2 §7–§9). In AWS CloudFront
# sets CloudFront-Viewer-Country and the sidecar forwards it. Locally: the client address is the
# first X-Forwarded-For hop when present (sim-world's shopper bots send one), else the socket
# address, looked up in geo/countries-local.conf. Only this host forwards it, and only to
# /v1/checkout/ — the console and the public API never trust a client-supplied country.
map $http_x_forwarded_for $payzeno_shopper_ip {
  ~^\s*(?<first>[0-9.]+)  $first;
  default                 $remote_addr;
}

geo $payzeno_shopper_ip $payzeno_geo_country {
  default "";
  include /etc/nginx/conf.d/geo/countries-local.conf;
}

map $uri $payzeno_pay_frame_ancestors {
  ~^/embed/  "*";
  default    "'none'";
}

server {
  listen 80;
  server_name pay.payzeno.com pay.localhost;

  access_log /var/log/nginx/access.log payzeno_json;
  client_max_body_size 64k;

  location ~ ^/internal/  { deny all; return 404; }

  # A location that sets any proxy_set_header inherits none from nginx.conf, so the four
  # shared ones are restated here; drop them and this location loses tracing.
  location /v1/checkout/  { limit_req zone=payzeno_public burst=50 nodelay;
                            proxy_set_header X-Request-Id          $request_id;
                            proxy_set_header X-Correlation-Id      $http_x_correlation_id;
                            proxy_set_header X-Forwarded-Proto     $scheme;
                            proxy_set_header Host                  $host;
                            proxy_set_header X-Payzeno-Geo-Country $payzeno_geo_country;
                            proxy_pass http://payzeno_api; }
  location /v1/           { return 404; }

  location /              { proxy_pass http://payzeno_checkout; }

  location = /healthz     { access_log off; default_type text/plain; return 200 "ok\n"; }

  # connect-src: the API (self) and the vault's public origin, where card digits are posted.
  # No third-party anything — see payzeno-checkout README "Rules".
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8099 https://vault.payzeno.com; frame-ancestors $payzeno_pay_frame_ancestors; form-action 'self'; base-uri 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
}
