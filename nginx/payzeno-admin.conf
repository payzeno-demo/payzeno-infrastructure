# nginx/payzeno-admin.conf — admin.payzeno.com, the staff back office (RFC platform-v2 §1).
#
# Same bundle as the console (payzeno-console builds index.html and admin.html side by side);
# this host serves the admin entry for every SPA route. In AWS it is the console's static
# site behind a second CloudFront distribution with the corporate SSO in front of it; locally
# it is open, and staff authenticate with their Payzeno staff login like everywhere else.
#
# The API is same-origin for the same reason as on the console: the staff session cookie and
# the pz_csrf double-submit stay first-party.

server {
  listen 80;
  server_name admin.payzeno.com admin.localhost;
  root /srv/console; index admin.html;

  access_log /var/log/nginx/access.log payzeno_json;

  location /assets/          { expires 1y; add_header Cache-Control immutable; }
  location /                 { try_files $uri /admin.html; }
  # `expires -1` alone (no add_header here): a location-level add_header would cancel every
  # server-level one below for the HTML itself, CSP included.
  location = /admin.html     { expires -1; }

  location ~ ^/internal/     { deny all; return 404; }
  location /v1/staff/auth/   { limit_req zone=payzeno_auth burst=10 nodelay;
                               proxy_pass http://payzeno_api; }
  location /v1/              { limit_req zone=payzeno_public burst=200 nodelay;
                               proxy_pass http://payzeno_api; }

  location = /healthz        { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Never framed, never indexed. KYC documents open in a new tab from /v1/admin/..., same origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
}
