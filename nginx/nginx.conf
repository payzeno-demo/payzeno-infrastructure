# nginx/nginx.conf — the shared http-level block.
#
# This file is not a full nginx.conf. It is the `http` fragment every Payzeno ingress
# loads: the log format, the three rate-limit zones, and the four proxy_set_header lines
# that every location inherits. The server blocks live in payzeno-*.conf next to it.
#
# Two planes read this:
#   * docker compose — mounted at /etc/nginx/conf.d, loaded into the stock image's http block
#   * ECS            — modules/nginx-sidecar renders the equivalent from terraform and puts
#                      it in S3. The sidecar's server block is generated; this file is the
#                      one a human edits, and the two are supposed to say the same thing.
#
# interfaces.md §6.3 freezes the body below. Anything you add goes around it, not through it.

# ---------------------------------------------------------------------------
# Access log format. arc PCI, PAY-1743, month 6.
#
# What this used to be, and what the compliance doc still quotes as the "before":
#
#   log_format payzeno_json escape=json '{"ts":"$time_iso8601","req_id":"$request_id",'
#       '"method":"$request_method","uri":"$uri","body":"$request_body",'
#       '"auth":"$http_authorization","status":$status,...}';
#
# $request_body on a POST /v1/payment_intents is a PAN. $http_authorization is a live API
# key. Both were going to CloudWatch, in plaintext, with 365-day retention, and nobody had
# looked at the format since month 1. They are gone and they do not come back — if you need
# to know whether a request carried credentials, $auth_present below tells you that without
# telling you what they were.
# ---------------------------------------------------------------------------

log_format payzeno_json escape=json '{"ts":"$time_iso8601","req_id":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"upstream":"$upstream_addr","rt":$request_time}';

# The replacement for logging the header itself: a boolean, not a value. Referenced by the
# api listener's per-location access_log lines when we need to tell an anonymous 401 from an
# authenticated one.
map $http_authorization $auth_present {
    default   "1";
    ""        "0";
}

# Correlation id passthrough. If the caller did not send one, X-Request-Id becomes it, so
# every log line in the chain — nginx, api, ledger, legacy — can be joined on one value.
map $http_x_correlation_id $payzeno_correlation_id {
    default   $http_x_correlation_id;
    ""        $request_id;
}

# ---------------------------------------------------------------------------
# Rate-limit zones. Three, because three populations abuse us differently:
#
#   payzeno_public  — anonymous by IP. The blunt one.
#   payzeno_apikey  — per API key, so one noisy merchant integration cannot spend another
#                     merchant's budget. dhotfix pushed back on this during arc PCI because
#                     the key is keying material and it is now a zone name in shared memory;
#                     the compromise is that we hash it into a 10m zone and never log it.
#                     See the thread on #212.
#   payzeno_auth    — 5r/s on the login and token paths. Credential stuffing, month 4.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=payzeno_public:10m rate=100r/s;
limit_req_zone $http_authorization  zone=payzeno_apikey:10m rate=300r/s;
limit_req_zone $binary_remote_addr zone=payzeno_auth:10m   rate=5r/s;

limit_req_status 429;
limit_req_log_level warn;

# ---------------------------------------------------------------------------
# Headers every upstream depends on. payzeno-api's RequestContextMiddleware reads
# X-Request-Id and X-Correlation-Id; the ledger's internal client forwards both onward.
# Dropping one of these does not break a request, it breaks every trace.
# ---------------------------------------------------------------------------

proxy_set_header X-Request-Id      $request_id;
proxy_set_header X-Correlation-Id  $http_x_correlation_id;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host              $host;

proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# RFC platform-v2 §9: the shopper's country is set by the edge, never by the client. Blank it
# everywhere; nginx/payzeno-pay.conf sets it from the geo lookup on /v1/checkout/ only.
proxy_set_header X-Payzeno-Geo-Country "";

# Upstream card fields never leave this process. arc PCI, same wave as the log format.
proxy_hide_header X-Payzeno-Card-Pan;
proxy_hide_header X-Payzeno-Card-Cvc;

server_tokens off;
client_max_body_size 1m;

# The server blocks. In the compose plane the stock image's own `include conf.d/*.conf`
# reaches these as well, so `make nginx-check` runs nginx with this file as the only
# entrypoint rather than letting both globs fire — see the payzeno-nginx service in
# docker-compose.override.yml. Keep the line: on the ECS sidecar path this file is mounted
# as /etc/nginx/nginx.conf and the explicit include is the only thing that loads them.
include /etc/nginx/conf.d/payzeno-*.conf;
