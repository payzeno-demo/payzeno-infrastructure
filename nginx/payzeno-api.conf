# nginx/payzeno-api.conf — the public listener for the platform API.
#
# This file and envs/*/routing.tf are two halves of one policy. api-surface.md §1.1 says the
# public surface is /v1/* and /ws/notifications and that /internal/v1/* is not reachable from
# the internet. nginx enforces that here; the ALB enforces it with
# module.rule_api_internal_deny (priority 10) and module.rule_api_v1 (priority 100).
#
# For five months the ALB half was created at priority 400 — behind the forward — and was
# therefore inert. Nothing broke, because this file caught it. That is PAY-1811, and it is
# the reason routing.tf now carries `check "internal_deny_precedes_v1"`. If you change the
# order of the locations below, change the priorities there in the same PR.

upstream payzeno_api { server payzeno-api:8080 max_fails=3 fail_timeout=10s; }

server {
  listen 80;
  server_name api.payzeno.com;

  access_log /var/log/nginx/access.log payzeno_json;

  # Card data arrives as a vault token, never as a PAN, so nothing legitimate here is large.
  # 1m was 10m until arc PCI — a 10m body is a 10m body in the error log. PAY-1747.
  client_max_body_size 1m;

  location = /healthz            { proxy_pass http://payzeno_api; access_log off; }

  # The internal surface is NEVER reachable from the public listener. Mirrored by
  # module.rule_api_internal_deny on the ALB.
  location ~ ^/internal/         { deny all; return 404; }

  location /v1/auth/             { limit_req zone=payzeno_auth burst=10 nodelay;
                                   proxy_pass http://payzeno_api; }
  location /v1/                  { limit_req zone=payzeno_public burst=200 nodelay;
                                   proxy_pass http://payzeno_api; }
  location /ws/notifications     { proxy_pass http://payzeno_api;
                                   proxy_http_version 1.1;
                                   proxy_set_header Upgrade $http_upgrade;
                                   proxy_set_header Connection "upgrade";
                                   proxy_read_timeout 3600s; }

  # The vault's PAN-entry iframe posts to us from vault.payzeno.com. An open CORS policy on
  # a payments API is a finding; this is the allowlist arc PCI settled on. The origin is the
  # same string as local.vault_public_origin in envs/production/main.tf.
  # Reverted. /v2/ was going to be the "everything is an intent" surface; the RFC did not
  # survive contact with the acquirer contracts and api-surface.md never grew a §2. Left in
  # place because it comes up roughly once a quarter and this is faster than re-litigating.
  #
  # location /v2/                { limit_req zone=payzeno_public burst=200 nodelay;
  #                                proxy_pass http://payzeno_api; }

  error_page 502 503 504 /_payzeno_upstream_error;
  location = /_payzeno_upstream_error {
    internal;
    default_type application/json;
    return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"payzeno-api is not answering."}';
  }
}
