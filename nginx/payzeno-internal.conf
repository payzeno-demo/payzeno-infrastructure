# nginx/payzeno-internal.conf — the internal listener. Port 8081, 10/8 only, never ALB-routed.
#
#   /internal/v1/invoices/       -> payzeno_legacy   (billing-legacy still owns invoices)
#   /internal/v1/charges/        -> payzeno_api      (api-surface.md §9b)
#   /internal/v1/                -> payzeno_ledger   (everything else — api-surface.md §10)
#
# nginx matches prefix locations longest-first regardless of file order, so the catch-all at
# the bottom cannot shadow the four above it. The ORDER here is for humans; the LENGTH is
#
# arc MIG step 4: /internal/v1/invoices/ flips to payzeno_ledger when ledger_owns_invoices is
# on payzeno-billing-legacy, both "false" in envs/production/services.tf, and the proxy_pass
# to edit. PAY-1904 — no date on it.

upstream payzeno_ledger { server payzeno-ledger:8000; }
upstream payzeno_legacy { server payzeno-billing-legacy:8090; }
