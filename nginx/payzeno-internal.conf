# nginx/payzeno-internal.conf — the internal listener. Port 8081, 10/8 only, never ALB-routed.
#
# THIS FILE IS THE STRANGLER BOUNDARY. domain-model.md §13 describes the migration in prose;
#
#   /internal/v1/invoices/       -> payzeno_legacy   (billing-legacy still owns invoices)
#   /internal/v1/subscriptions/  -> payzeno_legacy   (never leaving; not in MIG scope)
#   /internal/v1/charges/        -> payzeno_api      (api-surface.md §9b)
#   /internal/v1/                -> payzeno_ledger   (everything else — api-surface.md §10)
#
# nginx matches prefix locations longest-first regardless of file order, so the catch-all at
# the bottom cannot shadow the four above it. The ORDER here is for humans; the LENGTH is
#
# arc MIG step 4: /internal/v1/invoices/ flips to payzeno_ledger when ledger_owns_invoices is
# on payzeno-billing-legacy, both "false" in envs/production/services.tf, and the proxy_pass
# to edit. PAY-1904 — no date on it.

upstream payzeno_ledger { server payzeno-ledger:8000; }
upstream payzeno_legacy { server payzeno-billing-legacy:8090; }
upstream payzeno_api_internal { server payzeno-api:8080; }

server {
  listen 8081;
  allow 10.0.0.0/8; deny all;

  server_name _;
  access_log /var/log/nginx/internal.log payzeno_json;

  # The shared-secret header every internal caller sends (INTERNAL_API_SECRET /
  # PAYZENO_INTERNAL_SECRET in interfaces.md §7). nginx does not validate it — the receiving
  # service does, via InternalAuthGuard / verify_internal_secret — but it must survive the
  # hop, and a `proxy_set_header X-Payzeno-Internal ""` somewhere in the shared block would
  # make every internal call 401 with no useful log line. It has happened once.
  proxy_pass_request_headers on;

  # Internal calls are service-to-service and can be chunky: the legacy export posts a whole
  # invoice batch, and the ledger's settlement import accepts a file.
  client_max_body_size 32m;
  proxy_read_timeout 120s;

  location = /healthz { return 200 "ok\n"; access_log off; default_type text/plain; }

  location /internal/v1/invoices/     { proxy_pass http://payzeno_legacy; }
  location /internal/v1/subscriptions/{ proxy_pass http://payzeno_legacy; }
  location /internal/v1/merchants/    { proxy_pass http://payzeno_api_internal; }
  location /internal/v1/charges/      { proxy_pass http://payzeno_api_internal; }
  location /internal/v1/              { proxy_pass http://payzeno_ledger; }

  # Anything that is not /internal/v1/* has no business on this listener. The public surface
  # is api.payzeno.com:80 and it is a different file.
  location / { return 404; }
}
