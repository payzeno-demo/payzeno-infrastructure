# nginx/payzeno-console.conf — the merchant console, served as static files.
#
# In AWS the console is not behind nginx at all: it is S3 + CloudFront
# (module.payzeno_console, modules/static-site) and the SPA fallback is a CloudFront
# custom_error_response mapping 403/404 -> /index.html with status 200. This file is the
# compose-plane equivalent and the two have to agree — a deep link like
# /settlements/stl_01H8... must return the shell in both planes, or the console 404s only in
# local dev and nobody notices for a week.
#
# Cold file. Two commits in twelve months: created in month 1, and tflexbox's one PR in
# month 8 (asset caching + the CSP below). It is cold because it is right, not because it is
# forgotten — compare modules/rds-mysql/main.tf, which is cold for the other reason.

server {
  listen 80; server_name console.payzeno.com;
  root /srv/console; index index.html;
  location /assets/ { expires 1y; add_header Cache-Control immutable; }
  location /        { try_files $uri /index.html; }

  access_log /var/log/nginx/access.log payzeno_json;

  # Vite fingerprints everything under /assets/, so a year is safe there and NOTHING is safe
  # for index.html — cache the shell and a deploy takes effect whenever the browser feels
  # like it. This pair is the whole caching story; the CloudFront distribution sets the same
  # two TTLs via its ordered_cache_behavior.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  # tflexbox, month 8. connect-src has to list the API origin and the WebSocket origin
  # explicitly — VITE_PAYZENO_API_URL and VITE_WS_URL in interfaces.md §7 — and frame-src has
  # to allow the vault iframe or card entry silently renders a blank box. Sentry is in
  # connect-src because VITE_SENTRY_DSN posts from the browser.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://vault.payzeno.com; connect-src 'self' ws://localhost/ws/notifications wss://api.payzeno.com https://api.payzeno.com https://o412.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  # The console is a bundle, not a service. There is no upstream to health-check, so this is
  # a literal — compose's healthcheck for payzeno-nginx hits it.
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
}
