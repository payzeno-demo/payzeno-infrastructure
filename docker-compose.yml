# payzeno — THE root compose file.
#
# There is exactly one file in the org that DEFINES a service, and this is it (ADR 0003).
# Every service repo carries a thin docker-compose.override.yml that `extends:` a service
# from here; none of them redeclare `environment`, `ports` or `depends_on`. If you are about
# to add a service to one of those files, add it here instead and extend it there.
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
#   ... or `make up`, which does that and prints the URLs.
#
# Three rules this file exists to keep true:
#
#   1. The service NAME is the same string in four places: here, the terraform module name in
#      envs/*/services.tf, the service-discovery DNS label those modules produce, and the
#      *_BASE_URL values below. That is what makes http://payzeno-ledger:8000 in compose and
#      http://payzeno-ledger.production.payzeno.internal:8000 in ECS the same node and not
#      two string literals.
#   2. Every env var NAME here also appears in envs/*/services.tf. Values differ (localstack
#      vs AWS); names never do. interfaces.md §7 is the list, and
#      modules/ecs-service/variables.tf validates the terraform half against it.
#   3. AWS_ENDPOINT_URL is the one exception to rule 2. It points at localstack and it exists
#      HERE ONLY — the terraform module has an explicit validation rejecting it, because in
#      the VPC it resolves to nothing and every publish becomes a 30-second connect timeout.
#
# Ports are the same numbers as the terraform table: api 8080, ledger 8000, legacy 8090,
# vault 8099. Every service serves /healthz on its main port and every healthcheck hits it.

name: payzeno

services:
  # -------------------------------------------------------------------------
  # Ingress. The compose-plane equivalent of the ALB + the per-task sidecar.
  # nginx/ is mounted read-only; see nginx/payzeno-internal.conf for the strangler boundary.
  # -------------------------------------------------------------------------
  payzeno-nginx:
    image: nginx:1.25-alpine
    ports: ["80:80", "8081:8081"]
    volumes: ["./nginx:/etc/nginx/conf.d:ro"]
    depends_on: [payzeno-api, payzeno-console, payzeno-ledger, payzeno-billing-legacy]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost/healthz"] }

  # -------------------------------------------------------------------------
  # payzeno-api — the public platform API. NestJS. interfaces.md §7's api list, in full.
  # -------------------------------------------------------------------------
  payzeno-api:
    build: { context: ../payzeno-api }
    ports: ["8080:8080"]
    environment:                       # keys drawn verbatim from §7
      NODE_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://payzeno:payzeno@payzeno-postgres-api:5432/payzeno_api
      REDIS_URL: redis://payzeno-redis:6379/0
      LEDGER_BASE_URL: http://payzeno-ledger:8000
      BILLING_LEGACY_BASE_URL: http://payzeno-billing-legacy:8090
      VAULT_BASE_URL: http://payzeno-vault:8099
      AWS_ENDPOINT_URL: http://payzeno-localstack:4566

      # Internal auth. The SAME string as the ledger's INTERNAL_API_SECRET and the legacy
      # service's PAYZENO_INTERNAL_SECRET. All three must match or nothing talks to anything.
      INTERNAL_API_SECRET: dev-internal-secret-do-not-use-in-prod
      BILLING_LEGACY_USER: payzeno-api
      BILLING_LEGACY_PASSWORD: dev-legacy-password
      VAULT_PUBLIC_URL: http://localhost:8099
      VAULT_API_KEY: dev-vault-key

      WORLDFLOW_API_KEY: dev-worldflow-key
      NORDPAY_BASE_URL: http://payzeno-acquirer-sandbox:9101
      NORDPAY_API_KEY: dev-nordpay-key
      PROCESSOR_DEFAULT_ACQUIRER: worldflow

      SESSION_SECRET: dev-session-secret-32-bytes-minimum-ok
      CSRF_COOKIE_NAME: pz_csrf
      API_KEY_PEPPER: dev-api-key-pepper
      # An alias, not a key. Locally it resolves inside localstack's KMS.
      WEBHOOK_SIGNING_KEK: alias/payzeno-webhook-kek

      AWS_REGION: eu-west-1
      # Topic and queue names are frozen by events.ts's header table and api-surface.md §14,
      # and these are the same strings envs/*/messaging.tf creates. init-aws.sh in the
      # override file creates them in localstack under account 000000000000.
      SNS_PAYMENTS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:payzeno-payments-events
      SNS_MERCHANT_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:payzeno-merchant-events
      SQS_LEDGER_QUEUE_URL: http://payzeno-localstack:4566/000000000000/payzeno-api-ledger
      SQS_API_WEBHOOKS_URL: http://payzeno-localstack:4566/000000000000/payzeno-api-webhooks
      SQS_CONSOLE_NOTIFICATIONS_URL: http://payzeno-localstack:4566/000000000000/payzeno-console-notifications
      SQS_DLQ_URL: http://payzeno-localstack:4566/000000000000/payzeno-dlq-monitor

      # "postgres" locally, "database" in production — same backend, and the two spellings
      # are a wart the api's config schema accepts on purpose. Staging says "redis", which is
      # a real divergence and is called out in envs/staging/stack.tf.
      IDEMPOTENCY_BACKEND: postgres
      IDEMPOTENCY_TTL_HOURS: "24"
      IDEMPOTENCY_LEASE_SECONDS: "90"

      RATE_LIMIT_DEFAULT_RPM: "600"
      WEBHOOK_MAX_ATTEMPTS: "8"
      WEBHOOK_RETRY_WINDOW_HOURS: "24"
      REFUND_WINDOW_DAYS: "120"

      # arc MIG. Fees moved in month 3; invoices have not, and will not until
      # nginx/payzeno-internal.conf moves /internal/v1/invoices/ off payzeno_legacy.
      FLAG_LEDGER_OWNS_INVOICES: "false"
      FLAG_LEDGER_OWNS_FEES: "true"
      FLAG_REDACT_PAN_IN_LOGS: "true"

      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: http://payzeno-otel-collector:4318
    depends_on:
      payzeno-postgres-api: { condition: service_healthy }
      payzeno-redis:        { condition: service_healthy }
      payzeno-localstack:   { condition: service_healthy }
      payzeno-vault:        { condition: service_started }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"] }

  # -------------------------------------------------------------------------
  # payzeno-ledger — money. FastAPI. interfaces.md §7's ledger list, in full.
  #
  # FLAG_RECONCILE_RETRY_BATCH_LOCK is deliberately absent: PAY-2043 added it on the night of
  # the incident and PAY-2056 removed it a week later. app/flags.py documents that it was
  # three flags, not four, at HEAD. Do not re-add it here to "match the contract" — §7's note
  # says it exists only between those two tickets.
  # -------------------------------------------------------------------------
  payzeno-ledger:
    build: { context: ../payzeno-ledger }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://payzeno:payzeno@payzeno-postgres-ledger:5432/payzeno_ledger
      DATABASE_POOL_SIZE: "20"
      AWS_ENDPOINT_URL: http://payzeno-localstack:4566
      WORLDFLOW_BASE_URL: http://payzeno-acquirer-sandbox:9100
      NORDPAY_BASE_URL: http://payzeno-acquirer-sandbox:9101

      # 20 above is not arbitrary: reconcile_batch holds three sessions in one pass and the
      # retry drain takes a fourth. modules/rds-postgres asserts max_connections >= 3x this.
      DATABASE_POOL_MAX_OVERFLOW: "10"
      INTERNAL_API_SECRET: dev-internal-secret-do-not-use-in-prod

      AWS_REGION: eu-west-1
      SQS_PAYMENTS_QUEUE_URL: http://payzeno-localstack:4566/000000000000/payzeno-ledger-payments
      SQS_MERCHANTS_QUEUE_URL: http://payzeno-localstack:4566/000000000000/payzeno-ledger-merchants

      WORLDFLOW_API_KEY: sandbox_wf_0000000000000000
      WORLDFLOW_BREAKER_THRESHOLD_PCT: "50"
      WORLDFLOW_BREAKER_WINDOW: "100"
      WORLDFLOW_BREAKER_RESET_SECONDS: "30"
      NORDPAY_API_KEY: sandbox_np_0000000000000000
      NORDPAY_BREAKER_THRESHOLD_PCT: "50"
      NORDPAY_BREAKER_WINDOW: "100"
      NORDPAY_BREAKER_RESET_SECONDS: "30"

      RECONCILE_SWEEP_INTERVAL_SECONDS: "900"
      RECONCILE_SWEEP_WALL_BUDGET_SECONDS: "30"
      RECONCILE_MAX_ITEMS_PER_RUN: "500"
      RECONCILE_MAX_ATTEMPTS: "5"
      RECONCILE_RETRY_BACKOFF_BASE_SECONDS: "30"

      # false here and false on module.payzeno_ledger. It is true on exactly one thing in the
      # world: module.payzeno_ledger_canary, one task, a PAY-1688 leftover. That asymmetry is
      # why a 4,113-item backlog drained through a single task for 21 minutes. Turn it on in
      # the override file's payzeno-ledger-worker if you are trying to reproduce that.
      RETRY_DRAIN_INTERVAL_SECONDS: "60"
      RETRY_DRAIN_BATCH_SIZE: "50"
      RETRY_DRAIN_ENABLED: "false"

      PAYOUT_CUTOFF_ACH_UTC: "21:00"
      PAYOUT_CUTOFF_SAME_DAY_ACH_UTC: "16:45"
      PAYOUT_CUTOFF_SEPA_UTC: "14:00"
      PAYOUT_CUTOFF_FASTER_PAYMENTS_UTC: "17:30"

      LEDGER_AUDIT_ENABLED: "true"
      SETTLEMENT_IMPORT_ENABLED: "true"
      FUNDING_MATCH_TOLERANCE_BPS: "5"

      # Gates the CloudWatch custom metric Payzeno/Ledger DuplicateSettlementDetected, which
      # is what envs/production/alarms_ledger.tf alarms on. It does NOT gate the
      # settlement.duplicate_detected event — that publish is unconditional (interfaces.md §8).
      FLAG_DUPLICATE_SETTLEMENT_ALARM: "true"
      FLAG_PAYOUT_SAME_DAY_ACH: "false"
      FLAG_REDACT_PAN_IN_LOGS: "true"

      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://payzeno-otel-collector:4317
    depends_on:
      payzeno-postgres-ledger: { condition: service_healthy }
      payzeno-localstack:      { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"] }

  # -------------------------------------------------------------------------
  # payzeno-billing-legacy — Spring Boot 2.7, MySQL 8, 2016. interfaces.md §7's legacy list.
  # -------------------------------------------------------------------------
  payzeno-billing-legacy:
    build: { context: ../payzeno-billing-legacy }
    ports: ["8090:8090"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://payzeno-mysql-billing:3306/payzeno_billing
      PAYZENO_LEDGER_BASE_URL: http://payzeno-ledger:8000
      PAYZENO_API_BASE_URL: http://payzeno-api:8080

      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_USERNAME: payzeno
      SPRING_DATASOURCE_PASSWORD: payzeno
      PAYZENO_INTERNAL_SECRET: dev-internal-secret-do-not-use-in-prod

      BILLING_INVOICE_PREFIX: LOCAL
      BILLING_DUNNING_ENABLED: "false"
      # The legacy half of arc MIG. These two and the api's FLAG_LEDGER_OWNS_* must agree —
      # a half-flipped boundary means invoices exist in two places and agree in neither.
      BILLING_FLAG_LEDGER_OWNS_INVOICES: "false"
      BILLING_FLAG_LEDGER_OWNS_FEES: "true"
    depends_on:
      payzeno-mysql-billing: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"] }

  # -------------------------------------------------------------------------
  # payzeno-console — React/Vite. The seven VITE_* names are BUILD-time (ADR 0002): changing
  # one here does nothing until the image is rebuilt. In AWS this is not a container at all,
  # it is module.payzeno_console (S3 + CloudFront) and the values come from SSM.
  #
  # nginx/payzeno-console.conf serves /srv/console; the override file mounts the built bundle
  # there. Running this file alone gets you the console on its own port and a 404 from
  # console.payzeno.com — that is the one thing the override is load-bearing for.
  # -------------------------------------------------------------------------
  payzeno-console:
    build: { context: ../payzeno-console }
    environment:
      VITE_PAYZENO_API_URL: http://localhost/v1
      VITE_WS_URL: ws://localhost/ws/notifications
      VITE_VAULT_PUBLIC_URL: http://localhost:8099/public
      VITE_ENVIRONMENT: local
      VITE_SENTRY_DSN: ""
      VITE_FEATURE_SETTLEMENT_EXPLORER: "true"
      VITE_FEATURE_DISPUTE_EVIDENCE_V2: "false"
    depends_on: [payzeno-api]

  # -------------------------------------------------------------------------
  # Vendor and backing services. No build context — these are not our code.
  # -------------------------------------------------------------------------
  payzeno-vault:
    image: payzeno/card-vault:2.3
    ports: ["8099:8099"]
    environment:
      VAULT_API_KEY: dev-vault-key
      VAULT_MODE: sandbox
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8099/healthz"] }

  payzeno-postgres-api:
    image: postgres:15-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: payzeno
      POSTGRES_DB: payzeno_api
    volumes: ["payzeno-postgres-api-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payzeno -d payzeno_api"]
      interval: 5s
      timeout: 3s
      retries: 20

  payzeno-postgres-ledger:
    image: postgres:15-alpine
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: payzeno
      POSTGRES_PASSWORD: payzeno
      POSTGRES_DB: payzeno_ledger
    volumes: ["payzeno-postgres-ledger-data:/var/lib/postgresql/data"]
    # Two Postgres instances, not two databases in one instance. data-model.md §5 gives the
    # ledger its own; the settlement sweep is the noisiest reader in the platform and it is
    # not sharing a buffer cache with the API's request path.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payzeno -d payzeno_ledger"]
      timeout: 3s
      retries: 20

  payzeno-mysql-billing:
    image: mysql:8.0
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: payzeno
      MYSQL_USER: payzeno
      MYSQL_PASSWORD: payzeno
      MYSQL_DATABASE: payzeno_billing
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes: ["payzeno-mysql-billing-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-upayzeno", "-ppayzeno"]
      interval: 5s
      retries: 30

  payzeno-redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  payzeno-localstack:
    image: localstack/localstack:3
    ports: ["4566:4566"]
    environment:
      # Quoted, and it matters: interfaces.md §6.2 writes this as a YAML flow mapping
      # (`{ SERVICES: sns,sqs,s3,kms,secretsmanager }`) where the commas separate MAP ENTRIES,
      # not list items — so `sqs`, `s3`, `kms` and `secretsmanager` parse as four keys with
      # null values and localstack comes up with SNS only. Everything else then fails at
      # runtime with a connection error nobody attributes to a comma.
      SERVICES: "sns,sqs,s3,kms,secretsmanager"
      DEBUG: "0"
      AWS_DEFAULT_REGION: eu-west-1
    volumes: ["payzeno-localstack-data:/var/lib/localstack"]
    # The topics, queues and subscriptions are created by init-aws.sh, which the override
    # file drops into /etc/localstack/init/ready.d. `make seed` re-runs it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  payzeno-postgres-api-data:
  payzeno-postgres-ledger-data:
  payzeno-mysql-billing-data:
  payzeno-localstack-data:
